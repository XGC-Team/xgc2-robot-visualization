schema: xgc2.product.v1
id: xgc2-robot-visualization
name: XGC2 Robot Visualization
version: 0.2.0-7
kind: ros1-apt
summary: Reusable ROS Noetic RViz marker visualizers for XGC2 robot assets.
ros:
  distro: noetic
  packages:
  - xgc2_robot_visualization
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-robot-visualization
  packages:
  - ros-noetic-xgc2-robot-visualization
  depends:
  - ros-noetic-geometry-msgs
  - ros-noetic-nav-msgs
  - ros-noetic-roslib
  - ros-noetic-roscpp
  - ros-noetic-robot-state-publisher
  - ros-noetic-std-msgs
  - ros-noetic-visualization-msgs
  - ros-noetic-xgc2-mecanum-description (>= 0.1.0-1)
  recommends:
  - ros-noetic-xgc2-fs150-description (>= 0.1.0-3)
  - ros-noetic-xgc2-scout-description (>= 0.4.10-8)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-robot-visualization

    '
  smoke_test: 'rospack find xgc2_robot_visualization

    '
ownership:
  paths:
  - /opt/ros/noetic/share/xgc2_robot_visualization
  - /opt/ros/noetic/include/xgc2_robot_visualization
  - /opt/ros/noetic/lib/libfs150_uav_visualizer.so
  - /opt/ros/noetic/lib/libscout_ugv_visualizer.so
  - /opt/ros/noetic/lib/libmecanum_ugv_visualizer.so
  - /opt/ros/noetic/lib/librobot_description_runtime.so
  - /opt/ros/noetic/lib/librobot_path_runtime.so
  - /opt/ros/noetic/lib/xgc2_robot_visualization/xgc2_robot_description_publisher_node
release:
  requires:
  - xgc2-fs150-description
  - xgc2-mecanum-description
  - xgc2-scout-description
  dependency_policy:
    xgc2-fs150-description: verify
    xgc2-mecanum-description: rebuild
    xgc2-scout-description: verify
  apt_versions:
    focal: 0.2.0-7
